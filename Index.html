button,input,textarea,select{

button{

}

.hidden{

header{

.header-right{

.header-right button{

.container{

.auth-container{

.card{

h1,h2,h3{

}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.tabs button{

.tabs button.active{

    color:white;
}

input,
textarea,
select{

    margin:6px 0 10px;

    background:white;

textarea:focus,

}

textarea{

}

.primary{

    background:#6b3f25;
    color:white;

.secondary{

.search-row{

.search-row input{

.search-row button{

.business-title{

.business-actions button{

.map-box{

/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}



/* =========================================================
   ERRORES
========================================================= */

function firebaseError(error){

    const code =
        error?.code || "";

    const errors = {

        "auth/email-already-in-use":
            "Ese correo ya está registrado.",

        "auth/invalid-email":
            "El correo no es válido.",

        "auth/weak-password":
            "La contraseña debe tener al menos 6 caracteres.",

        "auth/invalid-credential":
            "Correo o contraseña incorrectos.",

        "auth/user-not-found":
            "No existe una cuenta con ese correo.",

        "auth/wrong-password":
            "Contraseña incorrecta.",

        "auth/too-many-requests":
            "Demasiados intentos. Espera un momento.",

        "auth/network-request-failed":
            "Problema de conexión a Internet.",

        "permission-denied":
            "Firebase rechazó la operación por las reglas de seguridad."

    };

    return errors[code]
        || error?.message
        || "Ocurrió un error.";

}

/* =========================================================
   CLOUDINARY UPLOAD
========================================================= */

async function uploadToCloudinary(file){

    if(!file){

        return null;
    }


    if(!file.type.startsWith("image/")){

        throw new Error(
            "El archivo seleccionado no es una imagen."
        );

    }


    const maxSize =
        10 * 1024 * 1024;


    if(file.size > maxSize){

        throw new Error(
            "La imagen supera el límite de 10 MB."
        );

    }


    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );


    const response =
        await fetch(
            CLOUDINARY_UPLOAD_URL,
            {
                method:"POST",
                body:formData
            }
        );


    let data = null;

    try{

        data =
            await response.json();

    }catch{

        throw new Error(
            "Cloudinary no devolvió una respuesta válida."
        );

    }


    if(!response.ok){

        console.error(
            "Cloudinary:",
            data
        );


        throw new Error(
            data?.error?.message
            || "Cloudinary rechazó la imagen."
        );

    }


    if(!data.secure_url){

        throw new Error(
            "Cloudinary no devolvió la URL de la imagen."
        );

    }


    return data.secure_url;

}

/* =========================================================
   CARGAR NEGOCIOS
========================================================= */

async function loadBusinesses(){

    const list =
        document
        .getElementById("businessList");


    list.innerHTML =
        `<div class="loading">
            Cargando negocios...
        </div>`;


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "businesses"
                )
            );


        allBusinesses = [];


        snapshot.forEach(item => {

            allBusinesses.push({

                id:item.id,

                ...item.data()

            });

        });


        allBusinesses.sort(
            (a,b) => {

                const aTime =
                    a.createdAt?.seconds
                    || 0;

                const bTime =
                    b.createdAt?.seconds
                    || 0;

                return bTime-aTime;

            }
        );


        renderBusinesses(
            allBusinesses
        );


    }catch(error){

        console.error(error);

        list.innerHTML =
            `<div class="empty">
                No se pudieron cargar los negocios.
            </div>`;


        showMessage(
            firebaseError(error)
        );

    }

}



/* =========================================================
   RENDER NEGOCIOS
========================================================= */

function renderBusinesses(list){

    const container =
        document
        .getElementById("businessList");


    container.innerHTML = "";


    if(!list.length){

        container.innerHTML =
            `<div class="empty">
                No hay negocios para mostrar.
            </div>`;

        return;

    }


    list.forEach(business => {

        const card =
            document.createElement("article");


        card.className =
            "card business";


        const image =
            business.imageURL
            || "https://via.placeholder.com/600x350?text=Negocio";


        let locationHTML = "";


        if(
            typeof business.latitude === "number"
            &&
            typeof business.longitude === "number"
        ){

            const mapsURL =
                "https://www.google.com/maps/search/?api=1&query="
                + encodeURIComponent(
                    business.latitude
                    + ","
                    + business.longitude
                );


            locationHTML = `
                <div class="map-box">
                    📍 Ubicación disponible
                    <br><br>
                    <a
                        href="${mapsURL}"
                        target="_blank"
                        rel="noopener noreferrer">
                        Abrir en Google Maps
                    </a>
                </div>
            `;

        }else if(business.address){

            const mapsURL =
                "https://www.google.com/maps/search/?api=1&query="
                + encodeURIComponent(
                    business.address
                    + ", "
                    + (business.city || "")
                );


            locationHTML = `
                <div class="map-box">
                    📍 ${escapeHTML(business.address)}
                    <br><br>
                    <a
                        href="${mapsURL}"
                        target="_blank"
                        rel="noopener noreferrer">
                        Buscar en Google Maps
                    </a>
                </div>
            `;

        }


        let phoneHTML = "";


        if(business.phone){

            phoneHTML = `
                <p>
                    📞
                    ${escapeHTML(business.phone)}
                </p>
            `;

        }


        let websiteHTML = "";


        if(business.website){

            const safeURL =
                normalizeURL(
                    business.website
                );


            websiteHTML = `
                <p>
                    🌐
                    <a
                        href="${safeURL}"
                        target="_blank"
                        rel="noopener noreferrer">
                        Visitar página
                    </a>
                </p>
            `;

        }


        let actionsHTML = "";


        if(business.phone){

            actionsHTML += `
                <button
                    class="secondary"
                    data-phone="${escapeHTML(business.phone)}"
                    data-action="whatsapp">
                    WhatsApp
                </button>
            `;

        }


        if(
            business.ownerId
            === currentUser?.uid
        ){

            actionsHTML += `
                <button
                    class="danger"
                    data-id="${escapeHTML(business.id)}"
                    data-action="delete">
                    Eliminar
                </button>
            `;

        }


        card.innerHTML = `

            <img
                class="business-image"
                src="${escapeHTML(image)}"
                alt="${escapeHTML(business.name || "Negocio")}"
                loading="lazy"
                onerror="
                    this.src='https://via.placeholder.com/600x350?text=Negocio'
                ">

            <h3 class="business-title">
                ${escapeHTML(
                    business.name
                    || "Sin nombre"
                )}
            </h3>

            <span class="category">
                ${escapeHTML(
                    business.category
                    || "Sin categoría"
                )}
            </span>

            <p>
                🏙️
                ${escapeHTML(
                    business.city
                    || "Sin ciudad"
                )}
            </p>

            ${
                business.description
                ?
                `<p>
                    ${escapeHTML(
                        business.description
                    )}
                </p>`
                :
                ""
            }

            ${phoneHTML}

            ${websiteHTML}

            ${locationHTML}

            <div class="business-actions">
                ${actionsHTML}
            </div>
        `;


        container.appendChild(card);

    });


    container
        .querySelectorAll(
            '[data-action="delete"]'
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    deleteBusiness(
                        button.dataset.id
                    );

                }
            );

        });


    container
        .querySelectorAll(
            '[data-action="whatsapp"]'
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    openWhatsApp(
                        button.dataset.phone
                    );

                }
            );

        });

}



/* =========================================================
   BUSCAR
========================================================= */

function searchBusinesses(){

    const text =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    if(!text){

        renderBusinesses(
            allBusinesses
        );

        return;
    }


    const filtered =
        allBusinesses.filter(
            business => {

                const searchable =
                    [

                        business.name,

                        business.category,

                        business.city,

                        business.address,

                        business.description

                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                return searchable.includes(
                    text
                );

            }
        );


    renderBusinesses(
        filtered
    );

}


document
    .getElementById("searchButton")
    .addEventListener(
        "click",
        searchBusinesses
    );


document
    .getElementById("showAllButton")
    .addEventListener(
        "click",
        () => {

            document
                .getElementById("searchInput")
                .value = "";

            renderBusinesses(
                allBusinesses
            );

        }
    );


document
    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        event => {

            if(event.key === "Enter"){

                searchBusinesses();

            }

        }
    );



/* =========================================================
   ELIMINAR NEGOCIO
========================================================= */

async function deleteBusiness(id){

    if(!currentUser){

        return;
    }


    const business =
        allBusinesses.find(
            item => item.id === id
        );


    if(!business){

        showMessage(
            "El negocio no existe."
        );

        return;
    }


    if(
        business.ownerId
        !== currentUser.uid
    ){

        showMessage(
            "Solo el propietario puede eliminarlo."
        );

        return;
    }


    const confirmed =
        confirm(
            "¿Seguro que quieres eliminar este negocio?"
        );


    if(!confirmed){

        return;
    }


    try{

        await deleteDoc(
            doc(
                db,
                "businesses",
                id
            )
        );


        showMessage(
            "Negocio eliminado."
        );


        await loadBusinesses();


    }catch(error){

        console.error(error);

        showMessage(
            firebaseError(error)
        );

    }

}



/* =========================================================
   WHATSAPP
========================================================= */

function openWhatsApp(phone){

    if(!phone){

        showMessage(
            "Este negocio no tiene teléfono."
        );

        return;
    }


    let clean =
        phone.replace(
            /[^\d]/g,
            ""
        );


    if(clean.length < 7){

        showMessage(
            "El número de teléfono no parece válido."
        );

        return;
    }


    window.open(
        "https://wa.me/"
        + clean,
        "_blank",
        "noopener"
    );

}



/* =========================================================
   GOOGLE MAPS / GPS
========================================================= */

document
    .getElementById("locationButton")
    .addEventListener(
        "click",
        () => {

            if(!navigator.geolocation){

                showMessage(
                    "Este navegador no permite obtener la ubicación."
                );

                return;
            }


            const status =
                document
                .getElementById(
                    "locationStatus"
                );


            status.style.display =
                "block";

            status.textContent =
                "Obteniendo ubicación...";


            navigator.geolocation.getCurrentPosition(

                position => {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;


                    document
                        .getElementById("latitude")
                        .value =
                        latitude;


                    document
                        .getElementById("longitude")
                        .value =
                        longitude;


                    status.textContent =
                        "Ubicación obtenida correctamente.";


                    showMessage(
                        "Ubicación obtenida."
                    );

                },


                error => {

                    console.error(error);


                    status.textContent =
                        "No se pudo obtener la ubicación. Permite el acceso a la ubicación del navegador.";


                    showMessage(
                        "No se pudo obtener la ubicación."
                    );

                },


                {

                    enableHighAccuracy:true,

                    timeout:15000,

                    maximumAge:0

                }

            );

        }
    );



/* =========================================================
   PERFIL
========================================================= */

async function loadProfile(){

    if(!currentUser){

        return;
    }


    try{

        const profileRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const profileSnapshot =
            await getDoc(
                profileRef
            );


        const nameInput =
            document
            .getElementById(
                "profileName"
            );


        const imagePreview =
            document
            .getElementById(
                "profileImagePreview"
            );


        if(profileSnapshot.exists()){

            const data =
                profileSnapshot.data();


            nameInput.value =
                data.name
                || currentUser.displayName
                || "";


            if(data.photoURL){

                imagePreview.src =
                    data.photoURL;

            }

        }else{

            nameInput.value =
                currentUser.displayName
                || "";

        }


    }catch(error){

        console.error(error);

    }

}



/* =========================================================
   GUARDAR PERFIL
========================================================= */

document
    .getElementById(
        "saveProfileButton"
    )
    .addEventListener(
        "click",
        async () => {

            if(!currentUser){

                return;
            }


            const name =
                document
                .getElementById(
                    "profileName"
                )
                .value
                .trim();


            const file =
                document
                .getElementById(
                    "profileImage"
                )
                .files[0];


            if(!name){

                showMessage(
                    "Escribe un nombre."
                );

                return;
            }


            const button =
                document
                .getElementById(
                    "saveProfileButton"
                );


            button.disabled = true;

            button.textContent =
                "Guardando...";


            try{

                let photoURL = null;


                if(file){

                    showMessage(
                        "Subiendo foto..."
                    );


                    photoURL =
                        await uploadToCloudinary(
                            file
                        );


                    document
                        .getElementById(
                            "profileImagePreview"
                        )
                        .src =
                        photoURL;

                }


                const profileData = {

                    uid:
                        currentUser.uid,

                    name:name,

                    email:
                        currentUser.email,

                    updatedAt:
                        serverTimestamp()

                };


                if(photoURL){

                    profileData.photoURL =
                        photoURL;

                }


                await setDoc(

                    doc(
                        db,
                        "users",
                        currentUser.uid
                    ),

                    profileData,

                    {
                        merge:true
                    }

                );


                await updateProfile(

                    currentUser,

                    {

                        displayName:name,

                        ...(photoURL
                            ?
                            {
                                photoURL:
                                    photoURL
                            }
                            :
                            {}
                        )

                    }

                );


                document
                    .getElementById(
                        "headerUserName"
                    )
                    .textContent =
                    name;


                showMessage(
                    "Perfil actualizado."
                );


            }catch(error){

                console.error(error);

                showMessage(
                    error.message
                    || "No se pudo guardar el perfil."
                );

            }finally{

                button.disabled = false;

                button.textContent =
                    "Guardar perfil";

            }

        }
    );



/* =========================================================
   NORMALIZAR URL
========================================================= */

function normalizeURL(url){

    if(!url){

        return "#";
    }


    const value =
        url.trim();


    if(
        value.startsWith("https://")
        ||
        value.startsWith("http://")
    ){

        return value;

    }


    return "https://" + value;

}
